# Which rows `make sync` copies from prod. The structure of every table is
# always copied; these rules only limit DATA. Preview with `make sync-plan`.
#
#   <TABLE>   FULL               all rows
#   <TABLE>   NONE               structure only, no rows
#   <TABLE>   LIMIT <n>          at most n rows
#   <TABLE>   SAMPLE <1-99>      about N percent of the rows
#   <TABLE>   WHERE <condition>  rows matching the condition (rest of the line)
#   USED      <rule>             tables the packages use (found automatically)
#   DEFAULT   <rule>             every other table
#
# Parent rows referenced by the copied rows are always copied too, so foreign
# keys stay valid and joins work. Tables used only through dynamic SQL are not
# found by USED: list them here.
#
# Examples:
#   ORDERS        WHERE created_at >= add_months(sysdate, -3)
#   AUDIT_TRAIL   NONE
#   COUNTRIES     FULL
#
# To copy everything instead, replace the two lines below with: DEFAULT FULL

DEFAULT   NONE
USED      LIMIT 5000
